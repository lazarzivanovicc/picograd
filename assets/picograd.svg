  <!-- Text -->
  <text x="200" y="115" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#111">
    pico<tspan fill="url(#grad)">grad</tspan>
  </text>

  <!-- Tagline -->
  <text x="200" y="145" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#666" letter-spacing="2">
